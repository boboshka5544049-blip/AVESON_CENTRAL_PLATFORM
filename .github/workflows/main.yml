name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extract AVESON CENTRAL project
        run: |
          rm -rf aveson_project
          mkdir aveson_project
          unzip -o AVESON_CENTRAL_GITHUB_READY.zip -d aveson_project

      - name: Fix MainActivity Java
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("aveson_project/app/src/main/java/com/aveson/central/MainActivity.java")
          s = p.read_text()

          if "import android.content.Intent;" not in s:
              s = s.replace(
                  "package com.aveson.central;",
                  "package com.aveson.central;\n\nimport android.content.Intent;"
              )

          pattern = r'open\.setOnClickListener\(v\s*->.*?\n\s*\);'

          replacement = '''open.setOnClickListener(v -> {
              if (title.equals("AVESON ARTIST CONTROL")) {
                  startActivity(new Intent(MainActivity.this, ArtistControlActivity.class));
              } else {
                  Toast.makeText(
                          this,
                          title + " — keyingi bosqichda ochiladi",
                          Toast.LENGTH_SHORT
                  ).show();
              }
          });'''

          new_s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)

          if count == 0:
              print("Artist Control listener not found; leaving existing code unchanged.")
          else:
              p.write_text(new_s)
              print("MainActivity.java fixed successfully.")

          print(p.read_text())
          PY

      - name: Build APK
        working-directory: aveson_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-debug
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
