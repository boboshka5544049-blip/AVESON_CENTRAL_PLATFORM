name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check project
        run: |
          echo "Repository:"
          ls -la

          echo "Checking Gradle files..."

          test -f settings.gradle || {
            echo "ERROR: settings.gradle topilmadi!"
            exit 1
          }

          test -f build.gradle || {
            echo "ERROR: build.gradle topilmadi!"
            exit 1
          }

          test -d app || {
            echo "ERROR: app papkasi topilmadi!"
            exit 1
          }

          echo "AVESON CENTRAL Gradle project OK."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build AVESON CENTRAL APK
        run: |
          gradle assembleDebug

      - name: Upload AVESON CENTRAL APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-debug
          path: app/build/outputs/apk/debug/app-debug.apk
