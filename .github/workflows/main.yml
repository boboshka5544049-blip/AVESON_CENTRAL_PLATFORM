name: Build AVESON CENTRAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract AVESON project
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_FIXED.zip -d build_src

      - name: Build APK
        run: |
          cd build_src
          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          find build_src -type f -name "*.apk" -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(find dist -name "*.apk" -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-APK
          path: dist/*.apk
          if-no-files-found: error
