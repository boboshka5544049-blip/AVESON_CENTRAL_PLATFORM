name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find AVESON CENTRAL ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'AVESON_CENTRAL_GITHUB_READ*.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AVESON CENTRAL ZIP topilmadi."
            echo "Repository root fayllari:"
            ls -la
            exit 1
          fi

          echo "ZIP topildi: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract AVESON CENTRAL project
        run: |
          rm -rf extracted_project
          mkdir extracted_project

          unzip -q "$ZIP_FILE" -d extracted_project

          echo "ZIP ichidagi fayllar:"
          find extracted_project -maxdepth 2 -type f | sort

      - name: Prepare Gradle project
        run: |
          if [ -f extracted_project/settings.gradle ]; then
            cp -a extracted_project/. .
          else
            PROJECT_DIR=$(find extracted_project -name settings.gradle -type f -printf '%h\n' | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: settings.gradle topilmadi."
              find extracted_project -maxdepth 4 -type f | sort
              exit 1
            fi

            cp -a "$PROJECT_DIR"/. .
          fi

          echo "Gradle project:"
          ls -la

          echo "settings.gradle:"
          test -f settings.gradle

          echo "app papkasi:"
          test -d app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload AVESON CENTRAL APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-real-debug
          path: app/build/outputs/apk/debug/app-debug.apk
