import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

public class ArtistControlActivity extends Activity {

    private static final int BG = Color.rgb(8, 10, 18);
    private static final int CARD = Color.rgb(20, 23, 35);
    private static final int CARD2 = Color.rgb(27, 30, 45);
    private static final int WHITE = Color.WHITE;
    private static final int MUTED = Color.rgb(170, 175, 190);
    private static final int PURPLE = Color.rgb(145, 75, 255);
    private static final int BLUE = Color.rgb(60, 120, 255);
    private static final int CYAN = Color.rgb(40, 210, 220);
    private static final int GREEN = Color.rgb(40, 190, 120);
    private static final int RED = Color.rgb(220, 70, 90);

    private int dp(float v) {
        return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
    }

    private LinearLayout.LayoutParams lp(int width, int height) {
        return new LinearLayout.LayoutParams(width, height);
    }

    private TextView label(String value, float size, int color) {
        TextView t = new TextView(this);
        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setPadding(dp(14), dp(8), dp(14), dp(8));
        return t;
    }

    private TextView title(String value) {
        TextView t = label(value, 20, WHITE);
        t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        return t;
    }

    private Button actionButton(String value, int color) {
        Button b = new Button(this);
        b.setText(value);
        b.setTextSize(14);
        b.setTextColor(WHITE);
        b.setAllCaps(false);
        b.setGravity(Gravity.CENTER);

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        dp(54));
        p.setMargins(dp(12), dp(6), dp(12), dp(6));
        b.setLayoutParams(p);
        b.setBackgroundColor(color);

        return b;
    }

    private EditText input(String hint) {
        EditText e = new EditText(this);
        e.setHint(hint);
        e.setHintTextColor(MUTED);
        e.setTextColor(WHITE);
        e.setTextSize(14);
        e.setSingleLine(true);
        e.setPadding(dp(14), dp(8), dp(14), dp(8));

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        dp(52));
        p.setMargins(dp(12), dp(5), dp(12), dp(5));
        e.setLayoutParams(p);
        return e;
    }

    private LinearLayout card(String heading) {
        LinearLayout box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setBackgroundColor(CARD);
        box.setPadding(dp(6), dp(8), dp(6), dp(10));

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.WRAP_CONTENT);
        p.setMargins(dp(10), dp(8), dp(10), dp(8));
        box.setLayoutParams(p);

        TextView h = title(heading);
        box.addView(h, lp(
                LinearLayout.LayoutParams.MATCH_PARENT,
                dp(52)));

        return box;
    }

    private void toast(String value) {
        Toast.makeText(this, value, Toast.LENGTH_SHORT).show();
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        buildScreen();
    }

    private void buildScreen() {

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(BG);

        LinearLayout header = new LinearLayout(this);
        header.setOrientation(LinearLayout.VERTICAL);
        header.setBackgroundColor(BG);

        Button back = actionButton("← BACK TO CENTRAL", PURPLE);
        back.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                finish();
            }
        });
        header.addView(back);

        TextView mainTitle = label(
                "AVESON ARTIST CONTROL",
                25,
                WHITE);
        mainTitle.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        mainTitle.setGravity(Gravity.CENTER);
        header.addView(mainTitle, lp(
                LinearLayout.LayoutParams.MATCH_PARENT,
                dp(62)));

        TextView sub = label(
                "Artist Management • Review • Control",
                13,
                CYAN);
        sub.setGravity(Gravity.CENTER);
        header.addView(sub, lp(
                LinearLayout.LayoutParams.MATCH_PARENT,
                dp(40)));

        root.addView(header, lp(
                LinearLayout.LayoutParams.MATCH_PARENT,
                LinearLayout.LayoutParams.WRAP_CONTENT));

        ScrollView scroll = new ScrollView(this);
        scroll.setFillViewport(true);

        LinearLayout content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);
        content.setPadding(0, dp(4), 0, dp(25));

        addArtists(content);
        addReleaseReview(content);
        addPendingReview(content);
        addVideo(content);
        addApproved(content);
        addRejected(content);
        addDistribution(content);
        addRights(content);
        addRoyalties(content);
        addAnalytics(content);
        addParameters(content);
        addRules(content);
        addSecurity(content);

        scroll.addView(content);

        root.addView(scroll, new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                0,
                1));

        setContentView(root);
    }

    private void addArtists(LinearLayout parent) {

