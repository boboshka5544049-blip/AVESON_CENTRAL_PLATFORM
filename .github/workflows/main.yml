JAVA

      - name: Fix Kotlin plugin compatibility
        run: |
          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' "$PROJECT_DIR/build.gradle" || true
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew || true
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON_CENTRAL_ARTIST_CONTROL_FIXED
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
