name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extract AVESON CENTRAL project
        run: |
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d aveson_project

      - name: Replace MainActivity.java
        working-directory: aveson_project
        run: |
          cat > app/src/main/java/com/aveson/central/MainActivity.java <<'EOF'
          package com.aveson.central;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private int dp(float value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size, int color) {
                  TextView v = new TextView(this);
                  v.setText(value);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }

              private LinearLayout room(String icon, String title, String subtitle) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(18), dp(16), dp(18), dp(16));
                  card.setBackgroundResource(R.drawable.panel);

                  TextView top = text(icon + "  " + title, 19, Color.WHITE);
                  top.setTypeface(null, android.graphics.Typeface.BOLD);
                  card.addView(top, new LinearLayout.LayoutParams(-1, dp(34)));

                  TextView sub = text(subtitle, 13, Color.rgb(158, 166, 199));
                  card.addView(sub, new LinearLayout.LayoutParams(-1, dp(42)));

                  Button open = new Button(this);
                  open.setText("OPEN  →");
                  open.setTextColor(Color.WHITE);
                  open.setTextSize(12);
                  open.setAllCaps(false);
                  open.setBackgroundResource(R.drawable.button);
                  card.addView(open, new LinearLayout.LayoutParams(-1, dp(44)));

                  open.setOnClickListener(v -> {
                      if (title.equals("AVESON ARTIST CONTROL")) {
                          startActivity(
                              new Intent(
                                  MainActivity.this,
                                  ArtistControlActivity.class
                              )
                          );
                      } else {
                          Toast.makeText(
                              this,
                              title + " — keyingi bosqichda ochiladi",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(-1, 0, 1f);
                  p.setMargins(0, dp(8), 0, dp(8));
                  card.setLayoutParams(p);

                  return card;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(8, 10, 20));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                      dp(18),
                      dp(12),
                      dp(18),
                      dp(14)
                  );

                  LinearLayout header = new LinearLayout(this);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  Button menu = new Button(this);
                  menu.setText("☰");
                  menu.setTextColor(Color.WHITE);
                  menu.setTextSize(20);
                  menu.setBackgroundResource(R.drawable.panel);

                  header.addView(
                      menu,
                      new LinearLayout.LayoutParams(
                          dp(54),
                          dp(48)
                      )
                  );

                  LinearLayout brand = new LinearLayout(this);
                  brand.setOrientation(LinearLayout.VERTICAL);
                  brand.setPadding(dp(14), 0, 0, 0);

                  TextView name =
                          text("AVESON CENTRAL", 20, Color.WHITE);
                  name.setTypeface(
                      null,
                      android.graphics.Typeface.BOLD
                  );

                  brand.addView(
                      name,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(27)
                      )
                  );

                  brand.addView(
                      text(
                          "CONTROL CENTER",
                          11,
                          Color.rgb(158, 166, 199)
                      ),
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(20)
                      )
                  );

                  header.addView(
                      brand,
                      new LinearLayout.LayoutParams(
                          0,
                          dp(48),
                          1f
                      )
                  );

                  root.addView(
                      header,
                      new LinearLayout.LayoutParams(
                          -1,
                          dp(54)
                      )
                  );

                  TextView title =
                          text(
                              "GLOBAL MUSIC ECOSYSTEM",
                              12,
                              Color.rgb(56, 189, 248)
                          );

                  title.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams tp =
                          new LinearLayout.LayoutParams(
                              -1,
                              dp(30)
                          );

                  tp.setMargins(0, dp(8), 0, 0);
                  root.addView(title, tp);

                  root.addView(
                      room(
                          "🎤",
                          "AVESON ARTIST CONTROL",
                          "Artistlarni va ularning yuborgan release'larini boshqarish."
                      )
                  );

                  root.addView(
                      room(
                          "🎵",
                          "AVESON MUSIC CONTROL",
                          "AVESON MUSIC katalogi va music tizimini boshqarish."
                      )
                  );

                  root.addView(
                      room(
                          "🌐",
                          "AVESON DISTRIBUTION CONTROL",
                          "Tasdiqlangan release'larni global platformalarga tarqatish."
                      )
                  );

                  menu.setOnClickListener(v ->
                      Toast.makeText(
                          this,
                          "Central Menu — keyingi bosqichda qo‘shiladi",
                          Toast.LENGTH_SHORT
                      ).show()
                  );

                  scroll.addView(root);
                  setContentView(scroll);
              }
          }
          EOF

      - name: Fix Kotlin dependencies
        working-directory: aveson_project
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build APK
        working-directory: aveson_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-debug
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
