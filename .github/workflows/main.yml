name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extract AVESON CENTRAL project
        run: |
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d aveson_project

      - name: Replace MainActivity.java
        working-directory: aveson_project
        run: |
          cat > app/src/main/java/com/aveson/central/MainActivity.java <<'EOF'
          package com.aveson.central;

          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private int dp(float value) {
                  return (int)(value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView text(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private LinearLayout room(String icon, String title, String subtitle) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setPadding(dp(18), dp(14), dp(18), dp(14));
                  card.setBackgroundResource(R.drawable.panel);

                  TextView name = text(icon + "  " + title, 18, Color.WHITE);
                  name.setTypeface(null, android.graphics.Typeface.BOLD);

                  TextView sub = text(subtitle, 13, Color.rgb(158,166,199));

                  Button open = new Button(this);
                  open.setText("OPEN  →");
                  open.setTextColor(Color.WHITE);
                  open.setTextSize(12);
                  open.setAllCaps(false);
                  open.setBackgroundResource(R.drawable.button);

                  card.addView(name, new LinearLayout.LayoutParams(-1, dp(34)));
                  card.addView(sub, new LinearLayout.LayoutParams(-1, dp(42)));
                  card.addView(open, new LinearLayout.LayoutParams(-1, dp(42)));

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(-1, dp(130));
                  p.setMargins(0, dp(7), 0, dp(7));
                  card.setLayoutParams(p);

                  open.setOnClickListener(v -> {
                      if (title.equals("AVESON ARTIST CONTROL")) {
                          startActivity(new Intent(
                                  MainActivity.this,
                                  ArtistControlActivity.class
                          ));
                      } else {
                          Toast.makeText(
                                  this,
                                  title + " — keyingi bosqichda ochiladi",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  return card;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(8,10,20));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(14), dp(18), dp(18));

                  TextView brand = text(
                          "AVESON CENTRAL",
                          24,
                          Color.WHITE
                  );
                  brand.setTypeface(null, android.graphics.Typeface.BOLD);
                  brand.setGravity(Gravity.CENTER);

                  root.addView(
                          brand,
                          new LinearLayout.LayoutParams(-1, dp(42))
                  );

                  TextView subtitle = text(
                          "CONTROL CENTER",
                          11,
                          Color.rgb(56,189,248)
                  );
                  subtitle.setGravity(Gravity.CENTER);

                  root.addView(
                          subtitle,
                          new LinearLayout.LayoutParams(-1, dp(24))
                  );

                  TextView ecosystem = text(
                          "GLOBAL MUSIC ECOSYSTEM",
                          12,
                          Color.rgb(139,92,246)
                  );
                  ecosystem.setGravity(Gravity.CENTER);

                  root.addView(
                          ecosystem,
                          new LinearLayout.LayoutParams(-1, dp(35))
                  );

                  root.addView(room(
                          "🎤",
                          "AVESON ARTIST CONTROL",
                          "Artistlar va release'larni boshqarish."
                  ));

                  root.addView(room(
                          "🎵",
                          "AVESON MUSIC CONTROL",
                          "Music katalog va music tizimini boshqarish."
                  ));

                  root.addView(room(
                          "🌐",
                          "AVESON DISTRIBUTION CONTROL",
                          "Release'larni global platformalarga tarqatish."
                  ));

                  scroll.addView(root);
                  setContentView(scroll);
              }
          }
          EOF

      - name: Replace ArtistControlActivity.java
        working-directory: aveson_project
        run: |
          cat > app/src/main/java/com/aveson/central/ArtistControlActivity.java <<'EOF'
          package com.aveson.central;

          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          public class ArtistControlActivity extends AppCompatActivity {

              private final int BG = Color.rgb(7, 9, 18);
              private final int CARD = Color.rgb(18, 22, 40);
              private final int CARD2 = Color.rgb(23, 28, 50);
              private final int TEXT = Color.WHITE;
              private final int MUTED = Color.rgb(158, 166, 199);
              private final int BLUE = Color.rgb(56, 189, 248);
              private final int PURPLE = Color.rgb(139, 92, 246);
              private final int GREEN = Color.rgb(74, 222, 128);
              private final int RED = Color.rgb(248, 113, 113);

              private LinearLayout root;

              private int dp(float v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private TextView label(String value, float size, int color) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private GradientDrawable background(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  g.setStroke(dp(1), Color.rgb(45, 51, 80));
                  return g;
              }

              private Button actionButton(String title, String description) {
                  Button b = new Button(this);

                  b.setText(title + "\n" + description);
                  b.setTextColor(TEXT);
                  b.setTextSize(14);
                  b.setGravity(Gravity.CENTER_VERTICAL | Gravity.LEFT);
                  b.setAllCaps(false);
                  b.setPadding(dp(16), 0, dp(12), 0);
                  b.setBackground(background(CARD2, 18));

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(70)
                          );

                  p.setMargins(0, dp(5), 0, dp(5));
                  b.setLayoutParams(p);

                  return b;
              }

              private TextView sectionTitle(String value) {
                  TextView t = label(value, 12, BLUE);
                  t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  t.setPadding(0, dp(14), 0, dp(6));
                  return t;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  showHome();
              }

              private void showHome() {

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(BG);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(
                          dp(18),
                          dp(12),
                          dp(18),
                          dp(24)
                  );

                  scroll.addView(root);
                  setContentView(scroll);

                  TextView back = label(
                          "←  BACK TO AVESON CENTRAL",
                          14,
                          BLUE
                  );

                  back.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  back.setPadding(0, dp(4), 0, dp(12));
                  back.setOnClickListener(v -> finish());

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)
                          )
                  );

                  TextView logo = label(
                          "AVESON",
                          30,
                          TEXT
                  );

                  logo.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );
                  logo.setGravity(Gravity.CENTER);

                  root.addView(
                          logo,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)
                          )
                  );

                  TextView mainTitle = label(
                          "ARTIST CONTROL",
                          15,
                          BLUE
                  );

                  mainTitle.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );
                  mainTitle.setGravity(Gravity.CENTER);

                  root.addView(
                          mainTitle,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(28)
                          )
                  );

                  TextView status = label(
                          "CENTRAL MANAGEMENT ROOM",
                          11,
                          MUTED
                  );

                  status.setGravity(Gravity.CENTER);

                  root.addView(
                          status,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(24)
                          )
                  );

                  root.addView(sectionTitle("OVERVIEW"));

                  root.addView(
                          statCard(
                                  "ARTISTS",
                                  "0",
                                  "Registered AVESON artists",
                                  BLUE
                          )
                  );

                  root.addView(
                          statCard(
                                  "PENDING",
                                  "0",
                                  "Submissions waiting for review",
                                  PURPLE
                          )
                  );

                  root.addView(
                          statCard(
                                  "APPROVED",
                                  "0",
                                  "Approved content",
                                  GREEN
                          )
                  );

                  root.addView(sectionTitle("ARTIST MANAGEMENT"));

                  Button artists = actionButton(
                          "👤  ARTISTS",
                          "Manage AVESON artist profiles"
                  );

                  artists.setOnClickListener(
                          v -> page(
                                  "ARTISTS",
                                  "Artist management",
                                  "Artist profiles\n\n• Artist accounts\n• Artist status\n• Release history\n• Video submissions\n• Artist information"
                          )
                  );

                  root.addView(artists);

                  root.addView(sectionTitle("RELEASE CONTROL"));

                  Button releases = actionButton(
                          "🎵  RELEASE QUEUE",
                          "Review music submitted by artists"
                  );

                  releases.setOnClickListener(
                          v -> page(
                                  "RELEASE QUEUE",
                                  "Incoming releases",
                                  "Music releases submitted by AVESON artists will appear here.\n\nAdmin can open each release and review the submitted information."
                          )
                  );

                  root.addView(releases);

                  Button pending = actionButton(
                          "⏳  PENDING REVIEW",
                          "Content waiting for admin decision"
                  );

                  pending.setOnClickListener(
                          v -> page(
                                  "PENDING REVIEW",
                                  "Waiting for decision",
                                  "All pending artist submissions will appear here.\n\nActions:\n• Review\n• Approve\n• Reject"
                          )
                  );

                  root.addView(pending);

                  Button approved = actionButton(
                          "✅  APPROVED",
                          "Approved content ready for next stage"
                  );

                  approved.setOnClickListener(
                          v -> page(
                                  "APPROVED",
                                  "Approved content",
                                  "Approved releases and content will appear here.\n\nNext stage can send approved content to Distribution Control."
                          )
                  );

                  root.addView(approved);

                  Button rejected = actionButton(
                          "❌  REJECTED",
                          "Rejected submissions and reasons"
                  );

                  rejected.setOnClickListener(
                          v -> page(
                                  "REJECTED",
                                  "Rejected content",
                                  "Rejected submissions will appear here together with the reason for rejection."
                          )
                  );

                  root.addView(rejected);

                  root.addView(sectionTitle("VIDEO CONTROL"));

                  Button videos = actionButton(
                          "🎬  VIDEO & CLIPS",
                          "Review artist video submissions"
                  );

                  videos.setOnClickListener(
                          v -> page(
                                  "VIDEO & CLIPS",
                                  "Video management",
                                  "Artist video and clip submissions will appear here.\n\n• Review video\n• Approve\n• Reject\n• Content status"
                          )
                  );

                  root.addView(videos);

                  root.addView(sectionTitle("BUSINESS & RIGHTS"));

                  Button distribution = actionButton(
                          "🌐  DISTRIBUTION",
                          "Send approved releases to next stage"
                  );

                  distribution.setOnClickListener(
                          v -> page(
                                  "DISTRIBUTION",
                                  "Distribution control",
                                  "Approved releases will be prepared for AVESON DISTRIBUTION CONTROL."
                          )
                  );

                  root.addView(distribution);

                  Button rights = actionButton(
                          "©  RIGHTS & COPYRIGHT",
                          "Manage ownership and copyright information"
                  );

                  rights.setOnClickListener(
                          v -> page(
                                  "RIGHTS & COPYRIGHT",
                                  "Rights management",
                                  "Copyright and ownership information for artist content will be managed here."
                          )
                  );

                  root.addView(rights);

                  Button royalties = actionButton(
                          "💰  ROYALTIES",
                          "Artist royalty management"
                  );

                  royalties.setOnClickListener(
                          v -> page(
                                  "ROYALTIES",
                                  "Royalty control",
                                  "Artist royalty information and future payment management will appear here."
                          )
                  );

                  root.addView(royalties);

                  root.addView(sectionTitle("SYSTEM"));

                  Button settings = actionButton(
                          "⚙  SETTINGS",
                          "Artist Control configuration"
                  );

                  settings.setOnClickListener(
                          v -> page(
                                  "SETTINGS",
                                  "Artist Control settings",
                                  "Management settings will appear here.\n\n• Review rules\n• Artist status rules\n• Content rules\n• System preferences"
                          )
                  );

                  root.addView(settings);
              }

              private LinearLayout statCard(
                      String name,
                      String number,
                      String description,
                      int accent
              ) {

                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.HORIZONTAL);
                  card.setGravity(Gravity.CENTER_VERTICAL);
                  card.setPadding(
                          dp(16),
                          dp(10),
                          dp(16),
                          dp(10)
                  );
                  card.setBackground(background(CARD, 18));

                  TextView numberView = label(
                          number,
                          25,
                          accent
                  );

                  numberView.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  card.addView(
                          numberView,
                          new LinearLayout.LayoutParams(
                                  dp(65),
                                  dp(60)
                          )
                  );

                  LinearLayout info = new LinearLayout(this);
                  info.setOrientation(LinearLayout.VERTICAL);

                  TextView title = label(
                          name,
                          15,
                          TEXT
                  );

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  info.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(27)
                          )
                  );

                  info.addView(
                          label(
                                  description,
                                  12,
                                  MUTED
                          ),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(28)
                          )
                  );

                  card.addView(
                          info,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(60),
                                  1
                          )
                  );

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(76)
                          );

                  p.setMargins(
                          0,
                          dp(4),
                          0,
                          dp(4)
                  );

                  card.setLayoutParams(p);

                  return card;
              }

              private void page(
                      String titleText,
                      String subtitleText,
                      String bodyText
              ) {

                  root.removeAllViews();

                  TextView back = label(
                          "←  BACK",
                          14,
                          BLUE
                  );

                  back.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  back.setOnClickListener(
                          v -> showHome()
                  );

                  root.addView(
                          back,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );

                  TextView title = label(
                          titleText,
                          27,
                          TEXT
                  );

                  title.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  root.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(48)
                          )
                  );

                  root.addView(
                          label(
                                  subtitleText,
                                  13,
                                  BLUE
                          ),
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(35)
                          )
                  );

                  TextView body = label(
                          bodyText,
                          15,
                          TEXT
                  );

                  body.setGravity(
                          Gravity.TOP | Gravity.LEFT
                  );
                  body.setPadding(
                          dp(18),
                          dp(18),
                          dp(18),
                          dp(18)
                  );
                  body.setBackground(
                          background(CARD, 20)
                  );

                  root.addView(
                          body,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(230)
                          )
                  );

                  Button home = actionButton(
                          "🎤  ARTIST CONTROL HOME",
                          "Return to Artist Control dashboard"
                  );

                  home.setOnClickListener(
                          v -> showHome()
                  );

                  root.addView(home);
              }
          }
          EOF

      - name: Fix Kotlin dependencies
        working-directory: aveson_project
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build APK
        working-directory: aveson_project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-debug
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
