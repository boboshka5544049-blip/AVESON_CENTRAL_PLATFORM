        box.addView(pendingArtists);

        Button suspendedArtists =
                actionButton("SUSPENDED ARTISTS", RED);
        suspendedArtists.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                toast("Suspended Artists");
            }
        });
        box.addView(suspendedArtists);

        parent.addView(box);
    }

    private void addReleaseReview(LinearLayout parent) {

