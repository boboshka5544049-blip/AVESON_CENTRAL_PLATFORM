name: Build AVESON CENTRAL

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract AVESON project
        run: |
          mkdir -p build_src
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d build_src

          if [ -d "build_src/aveson_project" ]; then
            PROJECT_DIR="build_src/aveson_project"
          else
            PROJECT_DIR="build_src"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Replace MainActivity
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/aveson/central"

          cat > "$PROJECT_DIR/app/src/main/java/com/aveson/central/MainActivity.java" <<'JAVA'
package com.aveson.central;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.view.Gravity;
import android.view.View;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.TextView;
import android.widget.Toast;

public class MainActivity extends Activity {

    private static final int BG = Color.rgb(8, 10, 18);
    private static final int CARD = Color.rgb(20, 23, 35);
    private static final int WHITE = Color.WHITE;
    private static final int MUTED = Color.rgb(170, 175, 190);
    private static final int PURPLE = Color.rgb(145, 75, 255);
    private static final int BLUE = Color.rgb(60, 120, 255);
    private static final int CYAN = Color.rgb(40, 210, 220);

    private int dp(float v) {
        return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
    }

    private TextView text(String value, float size, int color) {
        TextView t = new TextView(this);
        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setGravity(Gravity.CENTER_VERTICAL);
        t.setPadding(dp(16), dp(8), dp(16), dp(8));
        return t;
    }

    private LinearLayout.LayoutParams params(int width, int height) {
        return new LinearLayout.LayoutParams(width, height);
    }

    private Button roomButton(String title, int color) {
        Button b = new Button(this);
        b.setText(title);
        b.setTextSize(15);
        b.setTextColor(WHITE);
        b.setAllCaps(false);
        b.setGravity(Gravity.CENTER);
        b.setBackgroundColor(color);

        LinearLayout.LayoutParams p =
                new LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        dp(62));
        p.setMargins(dp(16), dp(8), dp(16), dp(8));
        b.setLayoutParams(p);

        return b;
    }

    private void showToast(String message) {
        Toast.makeText(this, message, Toast.LENGTH_SHORT).show();
    }

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        showHome();
    }

    private void showHome() {
        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setBackgroundColor(BG);

        TextView title = text("AVESON", 30, WHITE);
        title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        title.setGravity(Gravity.CENTER);
        root.addView(title, params(
                LinearLayout.LayoutParams.MATCH_PARENT,
                dp(70)));

        TextView subtitle = text("CENTRAL CONTROL CENTER", 14, CYAN);
        subtitle.setGravity(Gravity.CENTER);
        root.addView(subtitle, params(
                LinearLayout.LayoutParams.MATCH_PARENT,
                dp(45)));

        ScrollView scroll = new ScrollView(this);
        LinearLayout content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);
        content.setPadding(0, dp(10), 0, dp(20));

        Button artist = roomButton("AVESON ARTIST CONTROL", PURPLE);
        artist.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                startActivity(new android.content.Intent(
                        MainActivity.this,
                        ArtistControlActivity.class));
            }
        });
        content.addView(artist);

        Button music = roomButton("AVESON MUSIC CONTROL", BLUE);
        music.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                showToast("Music Control");
            }
        });
        content.addView(music);

        Button distribution =
                roomButton("AVESON DISTRIBUTION CONTROL", CYAN);
        distribution.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                showToast("Distribution Control");
            }
        });
        content.addView(distribution);

        scroll.addView(content);
        root.addView(scroll, new LinearLayout.LayoutParams(
                LinearLayout.LayoutParams.MATCH_PARENT,
                0,
                1));

        setContentView(root);
    }
}
JAVA

      - name: Replace ArtistControlActivity
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/java/com/aveson/central"

          cat > "$PROJECT_DIR/app/src/main/java/com/aveson/central/ArtistControlActivity.java" <<'JAVA'
package com.aveson.central;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.Color;
import android.graphics.Typeface;
import android.view.Gravity;
import android.view.View;
