name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Extract AVESON CENTRAL project
        run: |
          rm -rf aveson_project
          mkdir -p aveson_project
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d aveson_project

      - name: Verify Java source
        working-directory: aveson_project
        run: |
          echo "Checking ArtistControlActivity.java..."

          JAVA_FILE="app/src/main/java/com/aveson/central/ArtistControlActivity.java"

          if [ ! -f "$JAVA_FILE" ]; then
            echo "ERROR: ArtistControlActivity.java not found!"
            exit 1
          fi

          echo "Java file found."

      - name: Clean Java section markers
        working-directory: aveson_project
        run: |
          JAVA_FILE="app/src/main/java/com/aveson/central/ArtistControlActivity.java"

          sed -i 's/^[[:space:]]*#[[:space:]]*/\/\/ /' "$JAVA_FILE"

          echo "Java section markers cleaned."

      - name: Fix duplicate pending variable
        working-directory: aveson_project
        run: |
          JAVA_FILE="app/src/main/java/com/aveson/central/ArtistControlActivity.java"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/aveson/central/ArtistControlActivity.java")
          text = path.read_text()

          old = '''Button pending =
                    menuButton(
                            "⏳  VIEW PENDING ARTISTS");'''

          new = '''Button pendingArtistsButton =
                    menuButton(
                            "⏳  VIEW PENDING ARTISTS");'''

          text = text.replace(old, new)

          old2 = '''root.addView(pending);
                    pending.setOnClickListener(
                            v -> toast(
                                    "Pending artists opened"));'''

          new2 = '''root.addView(pendingArtistsButton);
                    pendingArtistsButton.setOnClickListener(
                            v -> toast(
                                    "Pending artists opened"));'''

          text = text.replace(old2, new2)

          path.write_text(text)
          print("Duplicate pending variable check completed.")
          PY

      - name: Remove accidental Java hash comments
        working-directory: aveson_project
        run: |
          JAVA_FILE="app/src/main/java/com/aveson/central/ArtistControlActivity.java"

          sed -i '/^[[:space:]]*#/d' "$JAVA_FILE"

          echo "Remaining hash-comment lines:"
          grep -n '^[[:space:]]*#' "$JAVA_FILE" || true

      - name: Fix Kotlin dependencies
        working-directory: aveson_project
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Check Gradle files
        working-directory: aveson_project
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        working-directory: aveson_project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: aveson_project
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-ARTIST-CONTROL-ARTISTS-2-0
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
