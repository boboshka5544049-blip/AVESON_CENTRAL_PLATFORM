name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. GRADLE 8.9
      # ============================================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"


      # ============================================================
      # 4. EXTRACT AVESON CENTRAL PROJECT
      # ============================================================

      - name: Extract AVESON CENTRAL project
        run: |
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d aveson_project


      # ============================================================
      # 5. MAIN ACTIVITY
      # ============================================================

      - name: Replace MainActivity.java
        working-directory: aveson_project
        run: |
          cat > app/src/main/java/com/aveson/central/MainActivity.java <<'EOF'
          package com.aveson.central;

          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private int dp(float value) {
                  return (int)(value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density + 0.5f);
              }

              private TextView text(
                      String value,
                      float size,
                      int color) {

                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);
                  return t;
              }

              private LinearLayout room(
                      String icon,
                      String title,
                      String subtitle) {

                  LinearLayout card =
                          new LinearLayout(this);

                  card.setOrientation(
                          LinearLayout.VERTICAL);

                  card.setPadding(
                          dp(18),
                          dp(14),
                          dp(18),
                          dp(14));

                  card.setBackgroundResource(
                          R.drawable.panel);

                  TextView name =
                          text(
                                  icon + "  " + title,
                                  18,
                                  Color.WHITE);

                  name.setTypeface(
                          null,
                          Typeface.BOLD);

                  TextView sub =
                          text(
                                  subtitle,
                                  13,
                                  Color.rgb(
                                          158,
                                          166,
                                          199));

                  Button open =
                          new Button(this);

                  open.setText("OPEN  →");
                  open.setTextColor(Color.WHITE);
                  open.setTextSize(12);
                  open.setAllCaps(false);
                  open.setGravity(Gravity.CENTER);
                  open.setMinHeight(0);
                  open.setMinimumHeight(0);
                  open.setPadding(0,0,0,0);
                  open.setBackgroundResource(
                          R.drawable.button);

                  LinearLayout.LayoutParams np =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(34));

                  LinearLayout.LayoutParams sp =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(34));

                  LinearLayout.LayoutParams op =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42));

                  op.topMargin = dp(6);

                  card.addView(name,np);
                  card.addView(sub,sp);
                  card.addView(open,op);

                  LinearLayout.LayoutParams cp =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2);

                  cp.setMargins(
                          0,
                          dp(7),
                          0,
                          dp(7));

                  card.setLayoutParams(cp);

                  open.setOnClickListener(v -> {

                      if (title.equals(
                              "AVESON ARTIST CONTROL")) {

                          startActivity(
                                  new Intent(
                                          MainActivity.this,
                                          ArtistControlActivity.class));

                      } else {

                          Toast.makeText(
                                  MainActivity.this,
                                  title +
                                  " — keyingi bosqichda ochiladi",
                                  Toast.LENGTH_SHORT).show();
                      }
                  });

                  return card;
              }

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setBackgroundColor(
                          Color.rgb(8,10,20));

                  LinearLayout root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(18),
                          dp(16),
                          dp(18),
                          dp(24));

                  TextView brand =
                          text(
                                  "AVESON CENTRAL",
                                  24,
                                  Color.WHITE);

                  brand.setTypeface(
                          null,
                          Typeface.BOLD);

                  brand.setGravity(Gravity.CENTER);

                  root.addView(
                          brand,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(42)));

                  TextView subtitle =
                          text(
                                  "CONTROL CENTER",
                                  11,
                                  Color.rgb(
                                          56,
                                          189,
                                          248));

                  subtitle.setGravity(Gravity.CENTER);

                  root.addView(
                          subtitle,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(24)));

                  TextView ecosystem =
                          text(
                                  "GLOBAL MUSIC ECOSYSTEM",
                                  12,
                                  Color.rgb(
                                          139,
                                          92,
                                          246));

                  ecosystem.setGravity(
                          Gravity.CENTER);

                  root.addView(
                          ecosystem,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(35)));

                  root.addView(
                          room(
                                  "🎤",
                                  "AVESON ARTIST CONTROL",
                                  "Artistlar va release'larni boshqarish."));

                  root.addView(
                          room(
                                  "🎵",
                                  "AVESON MUSIC CONTROL",
                                  "Music katalog va music tizimini boshqarish."));

                  root.addView(
                          room(
                                  "🌐",
                                  "AVESON DISTRIBUTION CONTROL",
                                  "Release'larni global platformalarga tarqatish."));

                  scroll.addView(root);

                  setContentView(scroll);
              }
          }
          EOF


      # ============================================================
      # 6. ARTIST CONTROL — FULL 13 MODULE VERSION
      # ============================================================

      - name: Replace ArtistControlActivity.java
        working-directory: aveson_project
        run: |
          cat > app/src/main/java/com/aveson/central/ArtistControlActivity.java <<'EOF'
          package com.aveson.central;

          import android.app.DatePickerDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.ArrayAdapter;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import java.util.Calendar;

          public class ArtistControlActivity
                  extends AppCompatActivity {

              private final int BG =
                      Color.rgb(7,9,18);

              private final int CARD =
                      Color.rgb(18,22,40);

              private final int CARD2 =
                      Color.rgb(24,29,51);

              private final int TEXT =
                      Color.WHITE;

              private final int MUTED =
                      Color.rgb(158,166,199);

              private final int BLUE =
                      Color.rgb(56,189,248);

              private final int PURPLE =
                      Color.rgb(139,92,246);

              private final int GREEN =
                      Color.rgb(52,211,153);

              private final int RED =
                      Color.rgb(248,113,113);

              private LinearLayout root;

              private int dp(float value) {
                  return (int)(
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                          + 0.5f);
              }


              // ====================================================
              // BASIC UI
              // ====================================================

              private TextView label(
                      String value,
                      float size,
                      int color) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(
                          Gravity.CENTER_VERTICAL);

                  return t;
              }

              private TextView title(
                      String value) {

                  TextView t =
                          label(
                                  value,
                                  25,
                                  TEXT);

                  t.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  t.setGravity(Gravity.CENTER);

                  return t;
              }

              private Button button(
                      String value) {

                  Button b =
                          new Button(this);

                  b.setText(value);
                  b.setTextColor(TEXT);
                  b.setTextSize(14);
                  b.setAllCaps(false);

                  b.setGravity(
                          Gravity.CENTER);

                  b.setBackgroundResource(
                          R.drawable.button);

                  b.setPadding(
                          dp(12),
                          0,
                          dp(12),
                          0);

                  return b;
              }

              private Button menuButton(
                      String value) {

                  Button b =
                          button(value);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(56));

                  p.setMargins(
                          0,
                          dp(6),
                          0,
                          dp(6));

                  b.setLayoutParams(p);

                  return b;
              }

              private LinearLayout page() {

                  ScrollView scroll =
                          new ScrollView(this);

                  scroll.setBackgroundColor(BG);

                  root =
                          new LinearLayout(this);

                  root.setOrientation(
                          LinearLayout.VERTICAL);

                  root.setPadding(
                          dp(18),
                          dp(30),
                          dp(18),
                          dp(28));

                  scroll.addView(root);

                  setContentView(scroll);

                  return root;
              }

              private void header(
                      String name,
                      boolean showBack) {

                  LinearLayout top =
                          new LinearLayout(this);

                  top.setOrientation(
                          LinearLayout.HORIZONTAL);

                  top.setGravity(
                          Gravity.CENTER_VERTICAL);

                  if (showBack) {

                      Button back =
                              button("←  BACK");

                      LinearLayout.LayoutParams bp =
                              new LinearLayout.LayoutParams(
                                      0,
                                      dp(40),
                                      1);

                      bp.setMargins(
                              0,
                              0,
                              dp(8),
                              0);

                      top.addView(
                              back,
                              bp);

                      back.setOnClickListener(
                              v -> home());
                  }

                  Button menu =
                          button("☰  MENU");

                  LinearLayout.LayoutParams mp =
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(40),
                                  1);

                  mp.setMargins(
                          dp(8),
                          0,
                          0,
                          0);

                  top.addView(
                          menu,
                          mp);

                  menu.setOnClickListener(
                          v -> menu());

                  root.addView(top);

                  TextView h =
                          title(name);

                  LinearLayout.LayoutParams hp =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(72));

                  hp.topMargin = dp(10);

                  root.addView(h,hp);
              }

              private void subtitle(
                      String value) {

                  TextView t =
                          label(
                                  value,
                                  13,
                                  MUTED);

                  t.setGravity(
                          Gravity.CENTER);

                  root.addView(
                          t,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(44)));
              }

              private void section(
                      String value) {

                  TextView t =
                          label(
                                  value,
                                  15,
                                  BLUE);

                  t.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(45));

                  p.topMargin = dp(10);

                  root.addView(t,p);
              }

              private LinearLayout card(
                      String heading,
                      String body) {

                  LinearLayout c =
                          new LinearLayout(this);

                  c.setOrientation(
                          LinearLayout.VERTICAL);

                  c.setPadding(
                          dp(16),
                          dp(14),
                          dp(16),
                          dp(14));

                  c.setBackgroundResource(
                          R.drawable.panel);

                  TextView h =
                          label(
                                  heading,
                                  16,
                                  TEXT);

                  h.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD);

                  TextView b =
                          label(
                                  body,
                                  13,
                                  MUTED);

                  b.setGravity(
                          Gravity.TOP);

                  c.addView(
                          h,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(34)));

                  c.addView(
                          b,
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(60)));

                  LinearLayout.LayoutParams cp =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  -2);

                  cp.setMargins(
                          0,
                          dp(6),
                          0,
                          dp(6));

                  root.addView(c,cp);

                  return c;
              }

              private EditText field(
                      String hint) {

                  EditText e =
                          new EditText(this);

                  e.setHint(hint);
                  e.setHintTextColor(MUTED);
                  e.setTextColor(TEXT);
                  e.setTextSize(14);
                  e.setSingleLine(true);

                  e.setPadding(
                          dp(14),
                          0,
                          dp(14),
                          0);

                  e.setBackgroundResource(
                          R.drawable.panel);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  -1,
                                  dp(54));

                  p.setMargins(
                          0,
                          dp(5),
                          0,
                          dp(5));

                  e.setLayoutParams(p);

                  return e;
              }

              private void toast(
                      String message) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT).show();
              }


              // ====================================================
              // HOME
              // ====================================================

              @Override
              protected void onCreate(
                      Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  home();
              }

              private void home() {

                  page();

                  header(
                          "AVESON ARTIST CONTROL",
                          true);

                  subtitle(
                          "Artist management • Release review • Content control");

                  section("MAIN CONTROL");

                  Button artists =
                          menuButton(
                                  "👤  ARTISTS");

                  Button releases =
                          menuButton(
                                  "🎵  RELEASE REVIEW");

                  Button pending =
                          menuButton(
                                  "⏳  PENDING REVIEW");

                  Button videos =
                          menuButton(
                                  "🎬  VIDEO & CLIPS");

                  root.addView(artists);
                  root.addView(releases);
                  root.addView(pending);
                  root.addView(videos);

                  artists.setOnClickListener(
                          v -> artists());

                  releases.setOnClickListener(
                          v -> releaseReview());

                  pending.setOnClickListener(
                          v -> pending());

                  videos.setOnClickListener(
                          v -> videos());
              }


              // ====================================================
              // 1. ARTISTS
              // ====================================================

              private void artists() {

                  page();

                  header(
                          "ARTISTS",
                          true);

                  subtitle(
                          "All registered AVESON artists");

                  EditText search =
                          field(
                                  "Search artist / Artist ID");

                  root.addView(search);

                  card(
                          "ARTIST-0001",
                          "Artist: Alex Morgan\n" +
                          "Status: ACTIVE\n" +
                          "Releases: 8\n" +
                          "Videos: 3\n" +
                          "Country: Uzbekistan");

                  card(
                          "ARTIST-0002",
                          "Artist: Nova Ray\n" +
                          "Status: PENDING\n" +
                          "Releases: 2\n" +
                          "Videos: 1\n" +
                          "Country: Kazakhstan");

                  card(
                          "ARTIST-0003",
                          "Artist: Midnight Soul\n" +
                          "Status: ACTIVE\n" +
                          "Releases: 14\n" +
                          "Videos: 5\n" +
                          "Country: Türkiye");

                  Button profile =
                          menuButton(
                                  "OPEN ARTIST PROFILE");

                  root.addView(profile);

                  profile.setOnClickListener(
                          v -> artistProfile());
              }

              private void artistProfile() {

                  page();

                  header(
                          "ARTIST PROFILE",
                          true);

                  card(
                          "ARTIST ID",
                          "AV-0001");

                  card(
                          "PROFILE",
                          "Name: Alex Morgan\n" +
                          "Status: ACTIVE\n" +
                          "Country: Uzbekistan\n" +
                          "Language: English\n" +
                          "Joined: 2026");

                  card(
                          "CATALOG",
                          "Singles: 6\n" +
                          "EP: 1\n" +
                          "Albums: 1\n" +
                          "Videos: 3");

                  card(
                          "ACTIVITY",
                          "Last release: Midnight\n" +
                          "Last submission: 14 Sep 2026\n" +
                          "Pending items: 2");

                  Button releases =
                          menuButton(
                                  "VIEW ARTIST RELEASES");

                  root.addView(releases);

                  releases.setOnClickListener(
                          v -> releaseReview());
              }


              // ====================================================
              // 2. RELEASE REVIEW
              // ====================================================

              private void releaseReview() {

                  page();

                  header(
                          "RELEASE REVIEW",
                          true);

                  subtitle(
                          "Review incoming music submissions");

                  card(
                          "RELEASE #AVR-1001",
                          "Title: Midnight\n" +
                          "Artist: Alex Morgan\n" +
                          "Genre: Pop\n" +
                          "Release date: 20 Sep 2026\n" +
                          "Audio: midnight.wav\n" +
                          "Cover: midnight.jpg");

                  Button open =
                          menuButton(
                                  "OPEN FULL RELEASE REVIEW");

                  root.addView(open);

                  open.setOnClickListener(
                          v -> fullReleaseReview());
              }

              private void fullReleaseReview() {

                  page();

                  header(
                          "FULL RELEASE REVIEW",
                          true);

                  card(
                          "BASIC INFORMATION",
                          "Title: Midnight\n" +
                          "Primary artist: Alex Morgan\n" +
                          "Genre: Pop\n" +
                          "Language: English\n" +
                          "Release type: Single");

                  card(
                          "AUDIO",
                          "File: midnight.wav\n" +
                          "Format: WAV\n" +
                          "Status: READY\n" +
                          "Quality check: PASSED");

                  card(
                          "COVER",
                          "File: midnight.jpg\n" +
                          "Size: 3000 × 3000\n" +
                          "Format: JPG\n" +
                          "Status: READY");

                  card(
                          "RIGHTS",
                          "Copyright owner: Alex Morgan\n" +
                          "Master rights: Artist\n" +
                          "Publishing: Artist\n" +
                          "Documentation: Submitted");

                  card(
                          "METADATA",
                          "Explicit: No\n" +
                          "Lyrics: Submitted\n" +
                          "ISRC: Pending\n" +
                          "UPC: Pending");

                  section("ADMIN DECISION");

                  Button approve =
                          menuButton(
                                  "✅  APPROVE RELEASE");

                  Button reject =
                          menuButton(
                                  "❌  REJECT RELEASE");

                  root.addView(approve);
                  root.addView(reject);

                  approve.setOnClickListener(
                          v -> {
                              toast(
                                      "Release approved");
                              approved();
                          });

                  reject.setOnClickListener(
                          v -> rejectForm());
              }

              private void rejectForm() {

                  page();

                  header(
                          "REJECT RELEASE",
                          true);

                  subtitle(
                          "Enter the reason for rejection");

                  EditText reason =
                          field(
                                  "Rejection reason");

                  reason.setSingleLine(false);
                  reason.setMinLines(4);

                  root.addView(reason);

                  Button send =
                          menuButton(
                                  "SEND REJECTION");

                  root.addView(send);

                  send.setOnClickListener(
                          v -> {

                              String r =
                                      reason
                                              .getText()
                                              .toString()
                                              .trim();

                              if (r.isEmpty()) {

                                  toast(
                                          "Rejection reason kiriting");

                              } else {

                                  toast(
                                          "Release rejected");
                                  rejected();
                              }
                          });
              }


              // ====================================================
              // 3. PENDING REVIEW
              // ====================================================

              private void pending() {

                  page();

                  header(
                          "PENDING REVIEW",
                          true);

                  subtitle(
                          "Items waiting for admin decision");

                  card(
                          "🎵 MUSIC",
                          "3 releases waiting\n" +
                          "Oldest: 14 Sep 2026");

                  card(
                          "🎬 VIDEO",
                          "2 videos waiting\n" +
                          "Oldest: 13 Sep 2026");

                  card(
                          "🖼 COVER",
                          "1 artwork waiting\n" +
                          "Requires quality check");

                  card(
                          "👤 ARTIST DATA",
                          "2 artist profiles waiting\n" +
                          "Identity/profile review");

                  Button review =
                          menuButton(
                                  "START NEXT REVIEW");

                  root.addView(review);

                  review.setOnClickListener(
                          v -> fullReleaseReview());
              }


              // ====================================================
              // 4. VIDEO & CLIPS
              // ====================================================

              private void videos() {

                  page();

                  header(
                          "VIDEO & CLIPS",
                          true);

                  subtitle(
                          "Artist video submission control");

                  card(
                          "VIDEO #AVV-2001",
                          "Artist: Alex Morgan\n" +
                          "Title: Midnight Official Video\n" +
                          "Format: MP4\n" +
                          "Status: Pending");

                  card(
                          "CLIP #AVC-3001",
                          "Artist: Nova Ray\n" +
                          "Platform clip\n" +
                          "Status: Processing");

                  card(
                          "VIDEO #AVV-2000",
                          "Artist: Midnight Soul\n" +
                          "Title: After Rain\n" +
                          "Status: Approved");

                  Button approve =
                          menuButton(
                                  "✅  APPROVE SELECTED");

                  Button reject =
                          menuButton(
                                  "❌  REJECT SELECTED");

                  root.addView(approve);
                  root.addView(reject);

                  approve.setOnClickListener(
                          v -> toast(
                                  "Video approved"));

                  reject.setOnClickListener(
                          v -> toast(
                                  "Video rejected"));
              }


              // ====================================================
              // 5. APPROVED
              // ====================================================

              private void approved() {

                  page();

                  header(
                          "APPROVED",
                          true);

                  subtitle(
                          "Approved content ready for production");

                  card(
                          "MIDNIGHT",
                          "Artist: Alex Morgan\n" +
                          "Type: Single\n" +
                          "Approved: 15 Sep 2026\n" +
                          "Distribution: READY");

                  card(
                          "AFTER RAIN",
                          "Artist: Midnight Soul\n" +
                          "Type: Single\n" +
                          "Approved: 14 Sep 2026\n" +
                          "Distribution: DELIVERED");

                  card(
                          "VIDEO",
                          "Artist: Nova Ray\n" +
                          "Status: Approved\n" +
                          "Processing: Complete");

                  Button distribution =
                          menuButton(
                                  "🌐  SEND TO DISTRIBUTION");

                  root.addView(distribution);

                  distribution.setOnClickListener(
                          v -> distribution());
              }


              // ====================================================
              // 6. REJECTED
              // ====================================================

              private void rejected() {

                  page();

                  header(
                          "REJECTED",
                          true);

                  subtitle(
                          "Rejected submissions and reasons");

                  card(
                          "RELEASE #AVR-0992",
                          "Artist: Example Artist\n" +
                          "Status: REJECTED\n" +
                          "Reason: Cover does not meet requirements");

                  card(
                          "VIDEO #AVV-1981",
                          "Artist: Example Artist\n" +
                          "Status: REJECTED\n" +
                          "Reason: Rights documentation missing");

                  card(
                          "RELEASE #AVR-0980",
                          "Artist: Example Artist\n" +
                          "Status: REJECTED\n" +
                          "Reason: Audio quality issue");

                  Button notify =
                          menuButton(
                                  "📨  NOTIFY ARTIST");

                  root.addView(notify);

                  notify.setOnClickListener(
                          v -> toast(
                                  "Artist notification queued"));
              }


              // ====================================================
              // 7. DISTRIBUTION
              // ====================================================

              private void distribution() {

                  page();

                  header(
                          "DISTRIBUTION",
                          true);

                  subtitle(
