name: Build AVESON CENTRAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract AVESON CENTRAL project
        run: |
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d aveson_project

      - name: Build APK
        working-directory: aveson_project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVESON-CENTRAL-debug
          path: aveson_project/app/build/outputs/apk/debug/app-debug.apk
