name: Build AVESON CENTRAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check ZIP
        run: |
          echo "Checking AVESON ZIP..."
          ls -la
          test -f AVESON_CENTRAL_ARTIST_CONTROL_READY.zip
          echo "ZIP FOUND"

      - name: Extract project
        run: |
          mkdir -p build_src
          unzip -o AVESON_CENTRAL_ARTIST_CONTROL_READY.zip -d build_src
          echo "ZIP EXTRACTED"
          find build_src -maxdepth 4 -type f | head -50
